services:
  kali:
    image: "kali-re-tools:${IMAGE_TAG:-latest}"
    pull_policy: never
    working_dir: /agent
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - "${HOST_PWD:-.}:/agent"
      - "${BINARY_NINJA_USER_DIR:-/tmp/.binaryninja-docker}:/home/agent/.binaryninja"
      - "${IDA_USER_DIR:-/tmp/.idapro-docker}:/home/agent/.idapro"
      - "${CLAUDE_USER_DIR:-/tmp/.claude-docker}:/home/agent/.claude"
      - "${CODEX_USER_DIR:-/tmp/.codex-docker}:/home/agent/.codex"
    ports:
      - "${MCP_GATEWAY_HOST_BIND:-127.0.0.1}:${MCP_GATEWAY_HOST_PORT:-8080}:${MCP_GATEWAY_PORT:-8080}"
    environment:
      - BN_USER_DIRECTORY=/home/agent/.binaryninja
      - IDADIR=/opt/ida-pro
      - HOME=/home/agent
      - USER=agent
      - LOGNAME=agent
      # MCP gateway (Phase 2) — all optional; gateway has sane defaults.
      - MCP_GATEWAY_TOKEN        # set to pin token; else generated at startup
      - MCP_GATEWAY_HOST         # default 127.0.0.1; set 0.0.0.0 to expose on all interfaces
      - MCP_GATEWAY_PORT         # default 8080
      - MCP_GATEWAY_MAX_UPLOAD_MB # default 1024 (1 GB)
      - MCP_GATEWAY_QUIET        # set to 1 to suppress bearer log line at startup
      # Phase 3 dual-mode flags (set by run_docker.sh per --remote vs local).
      - MCP_GATEWAY_ENABLED      # 1 = start gateway daemon (remote mode); 0 or unset = skip (local mode)
      - MCP_GATEWAY_HOST_BIND    # host-side bind interface for ports: (default 127.0.0.1; set 0.0.0.0 for LAN exposure)
      - MCP_GATEWAY_HOST_PORT    # host-side published port (default 8080)
      # Phase 11 D-DYN-FLAG-02: dynamic-mode env gate (default unset = off; set to "1" by run_docker.sh --dynamic)
      - MCP_GATEWAY_DYNAMIC_TOOLS
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
